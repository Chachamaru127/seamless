<text x="54" y="33" font-family="SF Pro Text, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="2" fill="#b5b2aa">seamless</text>
<text x="936" y="33" text-anchor="end" font-family="SF Pro Text, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8d8b85">Claude Code → Codex, same workspace</text>
<text x="40" y="96" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#e9e7e2" xml:space="preserve">$ seamless "run the failing test and tell me what you see"</text>
<text x="40" y="126" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#b5b2aa" xml:space="preserve">{"status":"ok","id":"req_8f2c","target":"codex:019a…","delivery":"submitted"}</text>
<text x="40" y="174" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#e9e7e2" xml:space="preserve">$ seamless status req_8f2c --wait 60</text>
<circle cx="52" cy="206" r="7" fill="#2f8f5b"/><path d="M48 206 l3 3 l6 -6" stroke="#141413" stroke-width="2" fill="none"/>
<text x="76" y="212" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#e9e7e2">accepted</text>
<text x="220" y="212" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#2f8f5b">observed</text>
<text x="356" y="212" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#b5b2aa">reservation written before the native write</text>
<text x="920" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#8d8b85">10:17:05</text>
<circle cx="52" cy="246" r="7" fill="#2f8f5b"/><path d="M48 246 l3 3 l6 -6" stroke="#141413" stroke-width="2" fill="none"/>
