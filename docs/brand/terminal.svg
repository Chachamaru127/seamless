<text x="220" y="252" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#2f8f5b">observed</text>
<text x="356" y="252" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#b5b2aa">read from the peer's own session record</text>
<text x="920" y="252" text-anchor="end" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#8d8b85">10:17:06</text>
<circle cx="52" cy="286" r="7" fill="#2f8f5b"/><path d="M48 286 l3 3 l6 -6" stroke="#141413" stroke-width="2" fill="none"/>
<text x="76" y="292" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#e9e7e2">processing</text>
<text x="220" y="292" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#2f8f5b">observed</text>
<text x="356" y="292" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#b5b2aa">the peer started a turn on this request</text>
<text x="920" y="292" text-anchor="end" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#8d8b85">10:17:07</text>
<circle cx="52" cy="326" r="7" fill="#2f8f5b"/><path d="M48 326 l3 3 l6 -6" stroke="#141413" stroke-width="2" fill="none"/>
<text x="76" y="332" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#e9e7e2">replied</text>
<text x="220" y="332" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#2f8f5b">observed</text>
<text x="356" y="332" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#b5b2aa">reply envelope carries replyTo = this id</text>
<text x="920" y="332" text-anchor="end" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#8d8b85">10:17:41</text>
<circle cx="52" cy="366" r="6" fill="none" stroke="#8d8b85" stroke-width="2"/>
<text x="76" y="372" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#e9e7e2">unknown</text>
<text x="220" y="372" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#8d8b85">unobserved</text>
<text x="356" y="372" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#b5b2aa">nothing was lost between the stages</text>
<text x="920" y="372" text-anchor="end" font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#8d8b85"></text>
<line x1="40" y1="400" x2="920" y2="400" stroke="#2e2e2b"/>
<text x="40" y="430" font-family="SF Pro Text, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8d8b85">Every stage is observed or unobserved, with the evidence that showed it. The sender never writes "reached" about itself.</text>
